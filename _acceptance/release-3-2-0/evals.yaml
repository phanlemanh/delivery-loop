  - id: E3
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/release-3-2-0/chay.sh cua-so
    expected: >
      Exit 0 và dòng «XANH: hai tập bằng nhau» — tập hồ sơ ĐƯỢC KÝ trong cửa sổ `1193bc22..HEAD`, suy từ kho bằng QUAN HỆ
      (bỏ hồ sơ mốc `release-*`), BẰNG đúng sáu hồ sơ kể trong Context: bang-chung-cu-theo-dau-vao, dac-ta-ux-doc-so-man,
      doi-soat-ban-giao, doi-ten-ban-uy-quyen, giam-sat-doc-ban-uy-quyen, nang-repo-setup-0-10-4. Chiều đỏ ở Notes (mốc lùi
      về thẻ v3.1.0 → «hồ sơ ĐƯỢC KÝ trong cửa sổ mà mốc KHÔNG kể: va-chu-ky-giu-cho-lenh-gop»).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
