    cmd: bash _acceptance/release-3-2-0/chay.sh dd-giu
    expected: >
      Exit 0 và dòng «XANH: diagram-design không đổi, giữ số» kèm «moc:   "version": "3.0.0", | HEAD:   "version": "3.0.0",».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/release-3-2-0/chay.sh goi-doi
    expected: >
      Exit 0 và dòng «XANH: hai gói chỉ đổi dòng version» — tập tệp đổi dưới `plugins/roadmap/` và `plugins/knowledge/` từ
      `1193bc22` tới HEAD bằng đúng hai tệp khai, mọi dòng đổi là dòng "version". Chiều đỏ ở Notes (cây chưa nâng số →
      «tập tệp đổi khác hai tệp khai»).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/release-3-2-0/chay.sh lop-chep
    expected: >
      Exit 0 và dòng «XANH: đúng 0 tệp đổi như ghi chú 3.2.0 kể» kèm «ghi chú 3.2.0 kể: (không chép gì)» — 39 tệp trong
      khối INIT-CI-COPY-LIST, không tệp nào đổi byte từ `1193bc22`; gạch «Lớp chép CI» của mục 3.2.0 nói đúng chữ «không
      chép gì». Chiều đỏ ở Notes (mục 3.2.0 chưa có gạch → thoát 2).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: bash _acceptance/release-3-2-0/chay.sh ghim-lai
    expected: >
      Exit 0, năm dòng «còn mới: <hồ sơ>» và dòng «XANH: 5/5 hồ sơ của chiến dịch ghim lại còn mới ở HEAD» — vị từ
      `pr-san-sang.mjs --chi-xet` của kit trả 0 cho bang-chung-cu-theo-dau-vao, dac-ta-ux-doc-so-man, doi-soat-ban-giao,
      doi-ten-ban-uy-quyen, giam-sat-doc-ban-uy-quyen. Chiều đỏ ở Notes (đo 28/11 trước chiến dịch: bốn dòng «ĐỎ: bằng
      chứng của <hồ sơ> không còn mới ở HEAD (mã 2)», thoát 1; đối chứng dương cùng ngày với một hồ sơ còn mới thoát 0).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-3-2-0/contract.md, _acceptance/release-3-2-0/do-dong-1.md, _acceptance/dac-ta-ux-doc-so-man/contract.md, _acceptance/dac-ta-ux-doc-so-man/decisions.jsonl, _acceptance/dac-ta-ux-doc-so-man/run-log.jsonl, _acceptance/dac-ta-ux-doc-so-man/usage-report.md, _acceptance/doi-soat-ban-giao/contract.md, _acceptance/doi-soat-ban-giao/decisions.jsonl, _acceptance/doi-soat-ban-giao/run-log.jsonl, _acceptance/doi-soat-ban-giao/usage-report.md, _acceptance/nang-repo-setup-0-10-4/contract.md, _acceptance/nang-repo-setup-0-10-4/decisions.jsonl, _acceptance/nang-repo-setup-0-10-4/run-log.jsonl, _acceptance/nang-repo-setup-0-10-4/usage-report.md, _acceptance/bang-chung-cu-theo-dau-vao/contract.md, _acceptance/bang-chung-cu-theo-dau-vao/decisions.jsonl, _acceptance/bang-chung-cu-theo-dau-vao/run-log.jsonl, _acceptance/bang-chung-cu-theo-dau-vao/usage-report.md, _acceptance/giam-sat-doc-ban-uy-quyen/contract.md, _acceptance/giam-sat-doc-ban-uy-quyen/decisions.jsonl, _acceptance/giam-sat-doc-ban-uy-quyen/run-log.jsonl, _acceptance/giam-sat-doc-ban-uy-quyen/usage-report.md, _acceptance/doi-ten-ban-uy-quyen/contract.md, _acceptance/doi-ten-ban-uy-quyen/decisions.jsonl, _acceptance/doi-ten-ban-uy-quyen/run-log.jsonl, _acceptance/doi-ten-ban-uy-quyen/usage-report.md, plugins/acceptance-gate/commands/acceptance-init.md]
    question: >
      Đọc AC-8 của contract release-3-2-0 và mục «## 3.2.0» của CHANGELOG.md (chỉ mục đó), cạnh đúng nguồn nó chép. (0) Ở mỗi
      mục con của sáu hồ sơ (dac-ta-ux-doc-so-man, doi-soat-ban-giao, nang-repo-setup-0-10-4, bang-chung-cu-theo-dau-vao,
      giam-sat-doc-ban-uy-quyen, doi-ten-ban-uy-quyen): dòng «Gốc:» (Context của hợp đồng ấy), gạch «Vật:» (dòng feature của
      hợp đồng ấy), giới hạn trích trong ngoặc «» — có phải chữ của hồ sơ ấy, không tóm tắt sáng tạo, không nói rộng hơn — và
      số giới hạn chọn ở Cổng Bằng chứng có khớp Notes hợp đồng và các dòng `gate2` của sổ quyết định của hồ sơ ấy không?
      (1) Bảng năm dòng số: mỗi ô có khớp nguồn đếm — lượt chấm và phán quyết (dòng `round-tally` của run-log), làn ghim lại
      và phút của chúng (dòng `repin`/`repin-do`, khoá `tong_ket.phut`), out-token và tỉ lệ vai trò (bảng «vai tro» của
      usage-report.md), phút máy của lượt chấm (dòng `wall:` cùng tệp), gọi người (dòng `gate1`/`gate2`/`seal` của sổ quyết
      định và Notes hợp đồng), giờ làm-xong/ký/gộp và số lần gộp nhánh chính vào nhánh (bảng commit của do-dong-1.md)? (2) Lời
      về lớp chép CI có đúng với khối INIT-CI-COPY-LIST của acceptance-init.md không — mục nói «không chép gì» và không kể tệp
      nào của khối? (3) Đoạn «Vì sao 3.2.0», «Ai bị ảnh hưởng» và «Kho tiêu thụ làm gì khi nhận» có nói thẳng đổi hành vi
      chạm kho đang dùng mà các mục con kể, và có nêu đủ bốn ca: kho KHÔNG có `governance/delegation.yaml` đổi hành vi gì; kho
      không cài gói `dispatch` đổi gì; phần của hồ sơ bang-chung-cu-theo-dau-vao đổi gì ở kho chưa bật khoá nào; lớp chép CI
      có phải chép lại không — và căn cứ chọn số minor có đúng với Context của hợp đồng release-3-2-0 không? (4) Mọi tên khoá
      và tên quyền của bản uỷ quyền trong mục có phải bộ tên tiếng Anh ghi ở hợp đồng doi-ten-ban-uy-quyen không — tên cũ chỉ
      được xuất hiện trong câu nói tệp còn tên cũ bị từ chối cả tệp? Trả PASS khi cả năm vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
