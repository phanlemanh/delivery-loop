<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đường bộ kiểm</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif','Lora',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1520px;width:100%}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem}
.sub{font-size:.85rem;color:var(--color-muted);margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Luồng · bo-kiem-xanh-o-kho-moi · Hỏi-2 · Hỏi-3</p>
<h1>Đường của bộ kiểm: từ kit-cu/main tới lượt chấm</h1>
<p class="sub">AC liên quan: AC-1, AC-3, AC-4, AC-8</p>
<svg viewBox="0 0 1712 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- ===== Mũi tên (vẽ trước nút) ===== -->
<!-- nhánh phụ: vòng gọi chéo → kit-cu/main -->
<line x1="120" y1="96" x2="120" y2="168" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<!-- kit-cu/main → kịch bản -->
<line x1="208" y1="192" x2="240" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- kịch bản → bước 6 -->
<line x1="400" y1="192" x2="436" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- bước 6 → A (trên) -->
<path d="M524 140 L524 120 A8 8 0 0 1 532 112 L656 112" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- bước 6 → B (dưới) -->
<path d="M524 244 L524 264 A8 8 0 0 0 532 272 L656 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- A → điểm gộp -->
<path d="M856 112 L876 112 A8 8 0 0 1 884 120 L884 188" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<!-- B → điểm gộp -->
<path d="M856 272 L876 272 A8 8 0 0 0 884 264 L884 196" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<!-- điểm gộp → sáu bước -->
<line x1="888" y1="192" x2="916" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- sáu bước → thước -->
<line x1="1092" y1="192" x2="1128" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- thước → lượt chấm (Hỏi-3) -->
<line x1="1304" y1="192" x2="1504" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== Nhãn mũi tên ===== -->
<rect x="592" y="92" width="16" height="12" rx="2" fill="#f5f5f5"/>
<text x="600" y="101" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A</text>
<rect x="592" y="252" width="16" height="12" rx="2" fill="#f5f5f5"/>
<text x="600" y="261" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">B</text>
<text x="512" y="128" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">HỎI-2</text>

<!-- Hỏi-3: hai lối trên mũi tên vào «lượt chấm» -->
<text x="1404" y="156" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HỎI-3</text>
<rect x="1356" y="168" width="96" height="14" rx="2" fill="#f5f5f5"/>
<text x="1404" y="179" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">chờ (khuyên)</text>
<rect x="1316" y="200" width="176" height="14" rx="2" fill="#f5f5f5"/>
<text x="1404" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chấm sớm, ký với danh sách chờ</text>

<!-- ===== Nút ===== -->
<!-- nhánh phụ: vòng gọi chéo (kho cũ) + K1 RT13 -->
<rect x="32" y="40" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="32" y="40" width="176" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="120" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vòng gọi chéo (kho cũ)</text>
<text x="120" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ K1 RT13</text>

<!-- kit-cu/main (khởi đầu) -->
<rect x="32" y="168" width="176" height="48" rx="24" fill="#f5f5f5"/>
<rect x="32" y="168" width="176" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="120" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">kit-cu/main</text>

<!-- kịch bản dọn nhà (5 commit B1) -->
<rect x="240" y="164" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="240" y="164" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">kịch bản dọn nhà</text>
<text x="320" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(5 commit B1)</text>

<!-- bước 6: đổi bộ kiểm (quyết định Hỏi-2) -->
<polygon points="436,192 524,140 612,192 524,244" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="524" y="188" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bước 6:</text>
<text x="524" y="204" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đổi bộ kiểm</text>

<!-- A: luật chung + bảng vá theo tệp (khuyên) -->
<rect x="656" y="84" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="656" y="84" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="756" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">luật chung +</text>
<text x="756" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bảng vá theo tệp</text>

<!-- B: nguồn bố cục ở kho cũ — vòng kho cũ lớn -->
<rect x="656" y="244" width="200" height="56" rx="6" fill="#f5f5f5"/>
<rect x="656" y="244" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="756" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nguồn bố cục ở kho cũ</text>
<rect x="704" y="276" width="104" height="14" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
<text x="756" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">vòng kho cũ lớn</text>

<!-- điểm gộp -->
<circle cx="884" cy="192" r="4" fill="#2d3142"/>

<!-- sáu bước bộ kiểm trên cây mới -->
<rect x="916" y="164" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="916" y="164" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1004" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sáu bước bộ kiểm</text>
<text x="1004" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trên cây mới</text>

<!-- thước giữ đủ khoá ca -->
<rect x="1128" y="164" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="1128" y="164" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1216" y="197" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">thước giữ đủ khoá ca</text>
<!-- nhãn số cạnh nút thước -->
<text x="1216" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle"><tspan fill="#636b80">248</tspan> → <tspan fill="#4f5d75">3 475</tspan> → (mục tiêu) <tspan fill="#2d3142" font-weight="600">5 548</tspan> khoá đạt</text>

<!-- lượt chấm (kết thúc) -->
<rect x="1504" y="168" width="176" height="48" rx="24" fill="#f5f5f5"/>
<rect x="1504" y="168" width="176" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="1592" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">lượt chấm</text>

<!-- ===== Chú giải ===== -->
<line x1="32" y1="336" x2="1680" y2="336" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="32" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI · HÌNH DẠNG MANG LOẠI</text>
<rect x="32" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="64" y="374" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">đầu / cuối (bầu dục)</text>
<rect x="212" y="364" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="244" y="374" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bước (chữ nhật)</text>
<polygon points="372,370 384,364 396,370 384,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="404" y="374" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">rẽ nhánh (thoi)</text>
<circle cx="536" cy="370" r="4" fill="#2d3142"/>
<text x="548" y="374" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">điểm gộp</text>
<line x1="640" y1="370" x2="668" y2="370" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="676" y="374" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">nhánh phụ</text>
<rect x="776" y="364" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="808" y="374" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">lối khuyên</text>
</svg>
</div>
</body>
</html>
