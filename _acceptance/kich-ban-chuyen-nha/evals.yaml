schema_version: 1
feature_slug: kich-ban-chuyen-nha
# Hai tầng đo:
#  - kho fixture do MÃ SINH trong lượt (migration/kich-ban/don-nha.test.mjs): chợ hai plugin, một plugin lấy gốc kho làm
#    nguồn, một lệnh đổi tên, một con trỏ ra ngoài, một tài liệu sống; Repo Standards giả là một kho git do mã sinh có
#    `apply.py` giả, mã của nó ghim trong một bảng xếp fixture (cờ --bang-xep) — không có cờ riêng cho kiểm; «sai thẻ»
#    = cùng kho giả thêm một commit. Mỗi phép đo có cặp hai chiều trên CÙNG fixture: vật lành → xanh, bản sao phá → đỏ với
#    thông điệp ghim. Đường dẫn suy từ vị trí tệp ca.
#  - nguồn thật (migration/kich-ban/thuoc-that.mjs): kit-cu/main lúc chấm + bản kéo Repo Standards tại 4dc53e0 (kéo
#    về thư mục tạm khi chưa có). In mã nguồn ở dòng đầu.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha
    expected: >
      Exit 0, có dòng `ok` của KB-AC1, KB-AC1-ngay, KB-AC1-do, KB-AC1-do-ngay. KB-AC1: hai lần chạy kịch bản trên fixture
      vào hai nhánh → cùng mã commit đỉnh, cùng mã cây, mỗi lần stdout có đúng một dòng `don-nha: <nguồn> → <commit>
      cây <cây>`. KB-AC1-ngay: khuôn giả lấy ngày theo một biến môi trường giả lập đồng hồ khi không được truyền today;
      hai lần chạy với hai ngày khác → vẫn cùng mã cây. KB-AC1-do: bản sao kịch bản bỏ biến ngày cố định (kim khớp đúng
      MỘT lần trong nguồn thật trước khi tiêm), hai lần chạy cách nhau ≥ 1 giây → đỏ «hai lần chạy khác mã commit».
      KB-AC1-do-ngay: bản sao bỏ truyền today cho khuôn, hai ngày → đỏ «hai lần chạy khác mã cây».
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E1t
    criterion: AC-1
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_that
    expected: >
      Exit 0. Dòng đầu `nguồn: <40-hex> (kit-cu/main)`. Có dòng `AC-1 đạt: hai lần chạy cùng commit <40-hex> cùng cây
      <40-hex>`.
    paths: [migration/kich-ban/**, migration/tra-soat/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha
    expected: >
      Exit 0, có `ok` của KB-AC2 và KB-AC2-do. KB-AC2: nhánh đích = nguồn + 5 commit, tiêu đề `dọn nhà 1/5: …` tới
      `dọn nhà 5/5: …`, cha commit 1 là nguồn; ảnh chụp mọi ref (trừ nhánh đích) + HEAD + `git status --porcelain` trước
      và sau bằng nhau, danh sách worktree trước và sau bằng nhau. KB-AC2-nguon-moi: chạy trên S1 vào don-nha/3.0, thêm
      commit S2 có một tệp mới trong thư mục sản phẩm, chạy lại cùng tên nhánh → thoát 0, cha commit 1 là S2, tệp mới ở
      plugins/<tên>/, danh sách worktree không đổi. KB-AC2-do: bản sao kịch bản ghi lên `chuyen-nha` → đỏ «ref không
      phải đích bị đổi: refs/heads/chuyen-nha».
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2t
    criterion: AC-2
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_that
    expected: >
      Exit 0, có dòng `AC-2 đạt: 5 commit trên <nguồn>, ref khác không đổi`.
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha
    expected: >
      Exit 0, có `ok` của KB-AC3, KB-AC3-do-mat, KB-AC3-do-hai. KB-AC3: trên fixture kiem-cho in `<n>/<n> tệp sản phẩm có
      đúng một chỗ` với n = số tệp sản phẩm + chưa rõ của fixture (đếm độc lập trong ca). KB-AC3-do-mat: bản sao cây
      mới xoá một tệp sản phẩm → đỏ «tệp sản phẩm không có chỗ: <đường>». KB-AC3-do-hai: chép thêm một bản về đường cũ →
      đỏ «tệp sản phẩm hai chỗ: <đường>».
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3t
    criterion: AC-3
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_that
    expected: >
      Exit 0, có dòng `AC-3 đạt: <n>/<n> tệp sản phẩm có đúng một chỗ · bỏ: <k>` với n ≥ 632 (610 san-pham + 22 chua-ro
      trên 0c4e503b; nguồn mới hơn có thể nhiều hơn) và dòng tách `san-pham <a> · chua-ro <b>` do thước tự đếm từ sổ
      kiểm kê của nguồn.
    paths: [migration/kich-ban/**, migration/tra-soat/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha
    expected: >
      Exit 0, có `ok` của KB-AC4, KB-AC4-ma-tran, KB-AC4-do, KB-AC4-do-neo, KB-AC4-doc-lap. KB-AC4: mọi tệp đã dời và
      mọi tệp tài liệu đã khai trên fixture — áp lại luật (mã riêng của kiem-cho) lên bản gốc = bản mới; tệp không phải
      sản phẩm khác giống từng byte. KB-AC4-ma-tran: ma trận viết trước trong tệp kiểm — năm chuỗi phải đổi đều đổi đúng
      đích, năm chuỗi phải giữ (scripts/cat-luot.mjs, lo-trinh-cat-luot, dieu-phoi.mjs, acceptance-gate-kit-tri-thuc,
      «skill `cat-luot`») có mặt nguyên byte; in «10/10». KB-AC4-do: sửa tay một dòng của một tệp đã dời → đỏ «nội dung
      lệch luật: <đường>». KB-AC4-do-neo: bản sao bảng xếp gỡ neo đuôi luật tên chợ → đỏ «chuỗi phải giữ bị đổi:
      acceptance-gate-kit-tri-thuc». KB-AC4-doc-lap: kiem-cho.mjs không import don-nha.mjs (đọc câu import của tệp).
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4t
    criterion: AC-4
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_that
    expected: >
      Exit 0, có dòng `AC-4 đạt: <n> tệp đúng luật, <m> tệp không phải sản phẩm giữ nguyên`, in số chỗ đổi của từng
      luật (không luật nào 0), và dòng `chuỗi phải giữ: dieu-phoi.mjs <a>→<a> · cat-luot.mjs <b>→<b> ·
      acceptance-gate-kit-tri-thuc <c>→<c>` (trước bằng sau, đếm trên tập tệp được đổi chữ).
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha
    expected: >
      Exit 0, có `ok` của KB-AC5 và KB-AC5-do. KB-AC5: tệp khai chợ của cây fixture mới có tên mới, mỗi source là
      `./plugins/<tên>` có `.claude-plugin/plugin.json` cùng name, không source nào là `./`. KB-AC5-do: bản sao tệp khai
      trỏ source không có → đỏ «nguồn plugin không có: <tên>».
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5t
    criterion: AC-5
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_that
    expected: >
      Exit 0, có dòng `AC-5 đạt: chợ delivery-loop, 6 plugin` liệt sáu tên (acceptance-gate, feature-loop,
      diagram-design, dispatch, roadmap, knowledge) và dòng `claude plugin validate: 7/7 qua` (chợ + sáu plugin). Máy
      không có lệnh `claude` → thoát 2 «không đọc được ở đây: thiếu lệnh claude», không xanh.
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_phien
    expected: >
      Exit 0. Chạy `chay-thu.mjs --ref <nguồn>` và `chay-thu.mjs --cay <cây mới>` rồi `--so … --bang-ten
      migration/chay-thu-phien/bang-ten.json`; lệnh so thoát 0, in sáu plugin, số lệnh và skill, ba tác tử của cây cũ
      và cây mới bằng nhau sau đổi tên, không mất không thừa. Phiên báo tốn tiền khác 0 → đỏ.
    paths: [migration/kich-ban/**, migration/chay-thu-phien/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha
    expected: >
      Exit 0, có `ok` của KB-AC7 và KB-AC7-do. KB-AC7: con trỏ văn xuôi trong skill và con trỏ trong chú thích mã của
      fixture thành `https://github.com/phanlemanh/acceptance-gate-kit/blob/<nguồn>/<đường>`; lệnh `node tests/a.test.mjs`
      (loại «lenh»), chỉ dẫn .md trỏ tests/ (loại «tu-host») và chuỗi trong mã giữ nguyên; thước in `AC-7 đạt: 2 con trỏ
      đã đổi, 2 giữ có lý do (lenh 1 · tu-host 1 · du-lieu 0 · duong-kho-tieu-thu 0), 0 còn treo trong plugins/`. KB-AC7-do: bản sao kịch bản bỏ bước con trỏ → đỏ «con trỏ còn
      treo: <tệp> → <đường>». (Bốn loại giữ thêm ở S3 — hai dòng sổ S3 «con trỏ là chỗ dẫn người đọc».)
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7t
    criterion: AC-7
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_that
    expected: >
      Exit 0, có dòng `AC-7 đạt: <k> con trỏ đã đổi, <g> giữ có lý do (lenh <a> · tu-host <t> · du-lieu <b> ·
      duong-kho-tieu-thu <c>), 0 còn treo trong plugins/` với k + g bằng số dòng con trỏ rõ của sổ nguồn mà thước tự đếm (76 trên 0c4e503b).
    paths: [migration/kich-ban/**, migration/tra-soat/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha
    expected: >
      Exit 0, có `ok` của KB-AC8-danh-sach, KB-AC8-do, KB-AC8-do-cham. KB-AC8-danh-sach: trên fixture, danh sách tệp
      commit 5 thêm, sửa, xoá so với commit 4 nằm trọn trong danh sách được phép của bảng xếp. KB-AC8-do: kho Repo
      Standards giả có HEAD khác mã bảng xếp ghim → thoát khác 0, stderr «khuôn không đúng thẻ <thẻ>» (thẻ đọc từ bảng
      xếp), nhánh đích không tồn tại sau lượt. KB-AC8-do-cham: khuôn giả sửa CLAUDE.md → thoát khác 0, «khuôn chạm tệp
      ngoài danh sách: CLAUDE.md», nhánh không có.
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8t
    criterion: AC-8
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_that
    expected: >
      Exit 0, có dòng `AC-8 đạt` kèm: `.repo-setup.json` preset claude-plugin · level starter · project_name
      delivery-loop; đủ bốn tệp khuôn; commit 5 chỉ chạm tệp trong danh sách được phép (in danh sách); không có .claude/skills/review-change; `make -n test` in lệnh bộ chạy của kit;
      plugin_lint không báo nguồn là cả kho; dòng `doctor: <điểm>/100 · plugin_source_not_root đạt`.
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha
    expected: >
      Exit 0, có `ok` của KB-AC9-lanh, KB-AC9-thu-muc, KB-AC9-luat, KB-AC9-khuon. Lành: fixture lành thoát 0, nhánh có.
      thu-muc: fixture thêm một thư mục gốc lạ → thoát ≠ 0, «thư mục gốc chưa xếp: <tên>», nhánh không có. luat: bảng
      tên thêm một lệnh không có ở nguồn → «luật không khớp chỗ nào: <luật>», nhánh không có. khuon: khuôn giả tạo một
      tệp đã có ở cây với nội dung khác → «khuôn xung đột: <tệp>», nhánh không có. Cả ba ca đỏ chạy lại sau khi nhánh
      đã có từ lần lành: nhánh giữ đúng mã cũ.
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.script.kich_ban_chuyen_nha_lop_do
    expected: >
      Exit 0. Đọc migration/kich-ban/ket-qua/lop-do.md: frontmatter có `nguon` (40-hex), `cay_moi` (40-hex), sáu bộ; với
      mỗi bộ số đỏ thêm = đỏ cây mới − đỏ cả hai cây; tổng các lớp = tổng đỏ thêm; dựng lại cây bằng kịch bản trên
      kit-cu/main LÚC CHẤM ra đúng `cay_moi` của báo cáo, không thì đỏ «báo cáo lớp đỏ đo trên cây cũ» (báo cáo đo trên
      nguồn khác kit-cu/main hiện tại in thêm một dòng «báo cáo đo trên <nguồn cũ>, kit-cu/main nay <mới>»). Hai chiều của
      phép dựng lại do ca KB-AC10-do-cay giữ.
    paths: [migration/kich-ban/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10j
    criterion: AC-10
    executor: judgment
    inputs:
      - migration/kich-ban/ket-qua/lop-do.md
      - _acceptance/kich-ban-chuyen-nha/contract.md
    question: >
      Đọc báo cáo lớp đỏ. Một người làm vòng B2 (bộ kiểm xanh ở kho mới) có dùng báo cáo này để chia việc được không:
      mỗi bộ có ba số (đỏ cây cũ, đỏ cây mới, đỏ thêm), ca đỏ thêm chia theo lớp dấu hiệu với dòng mẫu đủ để nhận ra
      nguyên nhân, lớp «khác» không nuốt phần lớn số ca, và ca đỏ ở cả hai cây được tách khỏi «đỏ thêm»?
    paths: [migration/kich-ban/ket-qua/lop-do.md]
    expected: PASS khi đủ bốn điều, kèm trích dòng báo cáo cho từng điều; FAIL nêu điều thiếu; UNCERTAIN khi báo cáo không đọc được.
    evidence_required: [run_id, verdict, judges, rationale]
