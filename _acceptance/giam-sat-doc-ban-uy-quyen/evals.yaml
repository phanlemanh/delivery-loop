      merge; đối chứng: PR chỉ chạm tệp khác → gộp) và "UQ-08-do bo-vung-cam"; «# fail 0». Chiều đỏ: bản sao gói bỏ kiểm vùng
      cấm trên tệp PR → ca đỏ «PR chạm governance/delegation.yaml mà vẫn gộp».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: bash _acceptance/giam-sat-doc-ban-uy-quyen/rang/chay.sh AC-9
    paths: [plugins/dispatch/scripts/thu-tu-gop.mjs, plugins/dispatch/scripts/lich.mjs, plugins/dispatch/scripts/phat-lich.mjs, plugins/dispatch/scripts/uy-quyen.mjs, plugins/dispatch/scripts/dieu-phoi.mjs, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
    expected: >
      exit 0; TAP có dòng «ok» cho "UQ-09 hoan-vi" (thiếu một dãy, thừa một dãy, trùng một dãy, không có quyền thu-tu-gop,
      phiên không phải giám sát → mỗi ca thoát khác 0 nêu dãy, quyền hay phiên, không ghi tệp thứ tự, sổ không có dung-quyen), "UQ-09 cap-theo-thu-tu" (hai dãy P1, P2 xin merge theo
      giờ P1 trước; thu-tu-gop P2,P1 → nhịp bộ phát lịch kế cấp khoá merge cho P2; không có tệp thứ tự → cấp P1 như cũ) và
      "UQ-09-do bo-kiem-hoan-vi"; «# fail 0». Chiều đỏ: bản sao gói bỏ kiểm hoán vị → ca đỏ «danh sách thiếu P1 mà vẫn ghi».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-10
    executor: test
    cmd: bash _acceptance/giam-sat-doc-ban-uy-quyen/rang/chay.sh AC-10
    paths: [plugins/dispatch/scripts/the.mjs, plugins/dispatch/scripts/dem.mjs, plugins/dispatch/scripts/uy-quyen.mjs, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
    expected: >
      exit 0; TAP có dòng «ok» cho "UQ-10 the" (kho có tệp: the khoi-tao --json có uy_quyen với nguon «origin/main@<sha7>»,
      nhan, van_hoi kèm câu, vang; may_di_tiep có uy-quyen; mảng hoi bằng hệt bản không tệp; tệp mang mục cấm → uy_quyen.loi
      nêu mục, nhan rỗng), "UQ-10 dem" (sổ SINH bằng hai lần gop --theo-quyen và một lần thu-tu-gop thật trên kho thử, không
      dòng viết tay → dem --json có dung_quyen {tong 3, theo_quyen {gop 2, thu-tu-gop 1}}), "UQ-10 xem-co-tep" (kho CÓ tệp:
      xem và xem --json bằng nhau từng byte giữa bản archive và bản mới) và "UQ-10-do hoi-them"; «# fail 0». Chiều đỏ: bản sao gói thêm uy-quyen vào hoi → ca đỏ
      «khối uỷ quyền thành câu hỏi».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-11
    executor: judgment
    inputs: [plugins/dispatch/commands/open.md, plugins/dispatch/commands/close.md, plugins/dispatch/scripts/mau/LUAT.md, plugins/dispatch/README.md, CONTEXT.md]
    question: >
      Bốn tệp đầu là chỉ dẫn mà phiên giám sát của gói điều phối đọc khi mở đợt, khi đóng đợt và luật đợt mà thợ đọc; tệp thứ
      năm là bảng từ của kit. Đợt chạy ở kho có tệp governance/delegation.yaml (bản uỷ quyền chủ kho viết, kit chỉ đọc ở đỉnh
      nhánh chính). Đọc như một phiên giám sát mới nhận vai: chỉ dẫn có nói đủ năm điều không — (1) trình khối uỷ quyền trên
      thẻ khởi tạo như mục máy đi tiếp có cửa phản đối, KHÔNG thành câu hỏi; (2) quyền gộp chỉ dùng khi chủ kho bật quyền tự
      merge ở thẻ khởi tạo; (3) gộp theo quyền chỉ qua `gop <số PR> --slug <slug> --theo-quyen --phien <mã>` và xếp lại thứ tự
      gộp chỉ qua `thu-tu-gop`, không có chỗ nào bảo giám sát gộp hay xếp bằng cách khác; (4) vùng cấm cứng (chữ ký cổng, việc
      khó đảo ngoài gộp, .github/workflows/ và governance/, luật sản phẩm, phạm vi/luật/bản uỷ quyền của chính đợt) và việc
      loại chưa dựng (chuyển hàng, mở dãy, phán quyết chung, lộ trình, dọn phiên) vẫn hỏi chủ kho; (5) báo cáo đợt khi đóng ghi
      dòng đếm số lần dùng quyền. Có từ nào nằm trong _Avoid_ của CONTEXT.md, hay chi tiết chỉ một kho tiêu thụ cụ thể mới hiểu
      không? PASS khi đủ năm điều và không vướng hai lỗi sau, trích một dòng cho mỗi điều; FAIL nêu điều thiếu và tệp lẽ ra
      phải nói; UNCERTAIN khi tệp không đọc được.
    paths: [plugins/dispatch/commands/open.md, plugins/dispatch/commands/close.md, plugins/dispatch/scripts/mau/LUAT.md, plugins/dispatch/README.md]
    expected: PASS kèm trích dòng cho từng điều; FAIL nêu điều thiếu
    evidence_required: [run_id, verifier, verified_at, output]
