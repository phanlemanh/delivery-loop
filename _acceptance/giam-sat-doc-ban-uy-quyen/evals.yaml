    cmd: bash _acceptance/giam-sat-doc-ban-uy-quyen/rang/chay.sh AC-4
    paths: [plugins/dispatch/scripts/uy-quyen.mjs, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
    expected: >
      exit 0; TAP có dòng «ok» cho "UQ-04 khoan-dung" (thiếu ban → nhan đủ, vang nêu «ban»; khoá lạ → vang nêu tên khoá; ban 2,
