      true lọt đúng một), "UQ-06 so-hong" (sổ là thư mục → thoát khác 0, nêu «không ghi được sự kiện dung-quyen», gh giả không nhận
      pr merge, tệp thứ tự không có) và "UQ-06-do bo-ghi"; «# fail 0». Chiều đỏ: bản sao gói bỏ lời ghi sự kiện → ca đỏ «lệnh
