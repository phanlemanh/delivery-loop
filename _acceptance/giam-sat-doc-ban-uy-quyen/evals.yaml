    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: bash _acceptance/giam-sat-doc-ban-uy-quyen/rang/chay.sh AC-7
    paths: [plugins/dispatch/scripts/gop.mjs, plugins/dispatch/scripts/uy-quyen.mjs, plugins/dispatch/scripts/dieu-phoi.mjs, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
    expected: >
      exit 0; TAP có dòng «ok» cho "UQ-07 gop" (đủ điều kiện → gh giả nhận đúng `pr merge <n> --merge --match-head-commit
      <sha>`, không lời gọi nào chứa --auto; khoá merge không còn sau lệnh), "UQ-07 ma-tran-thieu" (năm hàng viết trước:
      không phải giám sát · tu_merge không true · không có gop trong tệp · khoá merge bận · xetGop chặn (hồ sơ chưa ký) — mỗi
      hàng thoát khác 0 với thông điệp ghim của chính nó, gh giả không nhận pr merge, sổ không có dung-quyen; khoá do dãy khác
      giữ vẫn nguyên sau lệnh; hàng xetGop chặn thêm assert thư mục khoa/merge không còn), "UQ-07 nha-khoa" (ba lối hỏng SAU
      lúc giám sát giữ khoá — xetGop chặn, gh giả thoát 1 ở pr merge, sổ không ghi được — mỗi lối thoát khác 0 và thư mục
      khoa/merge không còn), "UQ-07-do bo-tu-merge" và "UQ-07-do nha-khoa-ngoai-finally"; «# fail 0». Chiều đỏ: bản sao gói bỏ
      kiểm tu_merge → hàng «tu_merge không true» đỏ; bản sao chỉ nhả khoá sau lúc gộp thành công → ca đỏ «khoá merge còn do
      giám sát giữ sau lệnh bị chặn».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: bash _acceptance/giam-sat-doc-ban-uy-quyen/rang/chay.sh AC-8
    paths: [plugins/dispatch/scripts/gop.mjs, plugins/dispatch/scripts/uy-quyen.mjs, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
