schema_version: 1
feature_slug: giam-sat-doc-ban-uy-quyen
# Một tệp ca mới (tests/dieu-phoi/uy-quyen.test.mjs), tên ca = mã tiêu chí («UQ-01 …» đo AC-1). Kho thử do mã sinh trong
# lượt: origin trần + bản clone, đợt mở bằng CLI thật, gh giả ghi lời gọi (tests/dieu-phoi/gh-gia.mjs); ngày commit và danh
# tính ghim nên sha tất định. `rang/chay.sh AC-n` chạy đúng các ca của tiêu chí và ĐÒI từng tên ca có dòng «ok» — mẫu lọc
# không khớp ca nào thì thoát 1, không xanh suông. Mỗi ca «-do» chạy CHÍNH hàm đo trên một bản sao trọn gói bị tiêm, sau khi
# bản lành xanh trên cùng kho thử, kiểm bước tiêm đã đổi tệp, và ghim thông điệp của đúng lỗi được tiêm.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: bash _acceptance/giam-sat-doc-ban-uy-quyen/rang/chay.sh AC-1
    paths: [plugins/dispatch/scripts/uy-quyen.mjs, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
    expected: >
      exit 0; TAP có dòng «ok» cho "UQ-01 nhanh-chinh" (nhan chứa gop, sha = rev-parse origin/main của kho thử),
      "UQ-01 pr-tu-them" (cây làm việc và nhánh PR thêm lo-trinh và thu-tu-gop: kết quả bằng hệt bản nhánh chính, không tên nào
      trong hai tên ấy xuất hiện), "UQ-01 xoa-tep" (xoá tệp trên nhánh chính → co false, nhan rỗng), "UQ-01 lay-ve-hong"
      (origin trỏ đường chết, ref cũ có tệp → nhan rỗng, loi nêu «không lấy được nhánh chính»), "UQ-01 lay-ve-hong-khong-tep"
      (origin trỏ đường chết, ref cũ KHÔNG có tệp → co false, loi null, vang rỗng) và "UQ-01-do doc-cay-lam-viec";
      «# fail 0». Chiều đỏ: bản sao gói đọc tệp từ cây làm việc → ca pr-tu-them đỏ với thông điệp «bộ đọc thấy loại do PR
      thêm: thu-tu-gop».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: bash _acceptance/giam-sat-doc-ban-uy-quyen/rang/chay.sh AC-2
    paths: [plugins/dispatch/scripts/uy-quyen.mjs, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
    expected: >
      exit 0; TAP có dòng «ok» cho "UQ-02 ma-tran" (in một dòng «<tên> · <nhóm> · đúng» cho mỗi tên của danh sách loại kit
      cộng một tên lạ; phien ở nhóm vẫn hỏi với câu «mở phiên: máy đã tự làm theo thẻ khởi tạo, không cần quyền — dọn phiên:
      chưa có phép so — vẫn hỏi chủ kho»; số dòng đúng = số tên + 1, viết trước trong ca; câu in khớp nguyên văn bảng §4 design doc; tên lạ →
      loi «loại lạ: <tên>», nhan rỗng) và "UQ-02-do bo-ten"; «# fail 0». Chiều đỏ: bản sao gói xoá mo-day khỏi danh sách →
      ma trận đỏ nêu «mo-day · mong vẫn hỏi · nhận lỗi đọc».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: test
    cmd: bash _acceptance/giam-sat-doc-ban-uy-quyen/rang/chay.sh AC-3
    paths: [plugins/dispatch/scripts/uy-quyen.mjs, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
    expected: >
      exit 0; TAP có dòng «ok» cho "UQ-03 ma-tran" (mỗi tên vùng cấm đặt cạnh gop: nhan rỗng, loi chứa đúng tên mục và «vùng
      cấm cứng»; số dòng = số tên vùng cấm, viết trước; đối chứng dương: cùng tệp bỏ tên cấm → nhan [gop]) và
      "UQ-03-do bo-qua-muc-cam"; «# fail 0». Chiều đỏ: bản sao gói bỏ mục cấm rồi nhận phần còn lại → ca đỏ «tệp có mục cấm
      governance mà vẫn nhận gop».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
