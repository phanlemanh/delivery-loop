    paths: [plugins/dispatch/scripts/**, tests/dieu-phoi/uy-quyen.test.mjs, _acceptance/giam-sat-doc-ban-uy-quyen/rang/**]
    expected: >
      exit 0; TAP có dòng «ok» cho "UQ-05 chieu-im" (bản gói dựng bằng git archive origin/main plugins/dispatch — trọn thư
      mục — và bản mới, cùng thư mục đợt không có tệp uỷ quyền: the khoi-tao --json, xem, xem --json, dem --json bằng nhau từng
