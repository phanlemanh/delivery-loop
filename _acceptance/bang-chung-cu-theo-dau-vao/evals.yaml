schema_version: 1
feature_slug: bang-chung-cu-theo-dau-vao
# Mọi phép đo máy đi qua `rang/chay.sh AC-n`. AC-1…AC-6 chạy đúng các ca `BC-<n>` của tệp ca
# tests/workflows/bang-chung-cu-theo-dau-vao.test.mjs bằng `node --test --test-name-pattern`, rồi ghim số ca đã viết trước
# («# pass k», «# fail 0») và dòng ok của từng ca theo tên — phán quyết không lấy từ mã thoát. Kho đo do mã sinh trong lượt
# (thư mục tạm; không dựng gì từ merge-base với origin/main — chạy được trên main sau gộp). Bản gốc vòng 8817a5bf rút bằng
# `git archive`. Mỗi ca có đối chứng dương trên cùng kho trước khi phá, và ghim thông điệp.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: bash _acceptance/bang-chung-cu-theo-dau-vao/rang/chay.sh AC-1
    paths: [plugins/feature-loop/scripts/pr-san-sang.mjs, plugins/feature-loop/scripts/lib/vat-doi-sau-pin.mjs, plugins/feature-loop/scripts/carry-plan.mjs, tests/workflows/bang-chung-cu-theo-dau-vao.test.mjs, _acceptance/bang-chung-cu-theo-dau-vao/rang/**]
    expected: >
      exit 0; dòng ok đúng tên «BC-1 chỉ T1 đổi → mở PR», «BC-1-do tệp ngoài T1 → thoát 2», «BC-1-doi-chung không khai T1 →
      LO-TRINH.html vẫn cũ»; «# pass 3», «# fail 0», rồi «AC-1: đạt — 3 ca». Chiều đỏ là BC-1-do (thông điệp ghim «vật đổi sau
      lượt chấm (src/a.ts)», origin không có nhánh, gh 0 lời gọi) và BC-1-doi-chung.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: script
    cmd: bash _acceptance/bang-chung-cu-theo-dau-vao/rang/chay.sh AC-2
    paths: [plugins/feature-loop/scripts/pr-san-sang.mjs, plugins/feature-loop/scripts/lib/vat-doi-sau-pin.mjs, tests/workflows/bang-chung-cu-theo-dau-vao.test.mjs, _acceptance/bang-chung-cu-theo-dau-vao/rang/**]
    expected: >
      exit 0; dòng ok «BC-2 ngoài paths khi bật → mở PR», «BC-2-do trong paths → thoát 2», «BC-2-khong-ap eval máy thiếu paths
      → giữ luật cũ», «BC-2-doi-chung cây bằng pin → không thoát 2»; «# pass 4», «# fail 0», «AC-2: đạt — 4 ca». Ca BC-2 ghim dòng
      «bỏ qua theo paths: 1 tệp — src/b.ts»; BC-2-khong-ap ghim lý do chứa «eval-may-thieu-paths:».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/bang-chung-cu-theo-dau-vao/rang/chay.sh AC-3
    paths: [plugins/feature-loop/scripts/pr-san-sang.mjs, plugins/feature-loop/scripts/repin-lane.mjs, plugins/feature-loop/scripts/lib/vat-doi-sau-pin.mjs, plugins/feature-loop/scripts/carry-plan.mjs, plugins/acceptance-gate/scripts/pre-merge-check.sh, plugins/acceptance-gate/lib/evidence-core.cjs, tests/workflows/bang-chung-cu-theo-dau-vao.test.mjs, _acceptance/bang-chung-cu-theo-dau-vao/rang/**]
    expected: >
      exit 0; dòng ok «BC-3 ma trận mười ca», «BC-3-dot-bien bỏ vế T1 → lật cả hai bên đọc», «BC-3-luoi bốn ca khớp
      pre-merge-check.sh»; «# pass 3», «# fail 0», «AC-3: đạt — 3 ca». Ca ma trận so đúng 20 phán quyết với cột mong đợi viết trước
      trong hợp đồng (số phán quyết đếm được khác 20 → ca đỏ).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/bang-chung-cu-theo-dau-vao/rang/chay.sh AC-4
    paths: [plugins/feature-loop/scripts/pr-san-sang.mjs, plugins/feature-loop/scripts/lib/vat-doi-sau-pin.mjs, _acceptance/bang-chung-cu-theo-dau-vao/rang/**]
    expected: >
      exit 0; dòng ok «BC-4 kho không khai → thông điệp bằng bản gốc vòng», «BC-4-doi-chung cây bằng pin → cả hai bản không
      thoát 2»; «# pass 2», «# fail 0», «AC-4: đạt — 2 ca». Tệp ca nằm ở rang/ của hồ sơ (không vào bộ kiểm của kit). Bản gốc vòng
      rút bằng git archive 8817a5bf trong lượt; rút không được → ca đỏ nêu «không rút được bản gốc vòng», không xanh.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
