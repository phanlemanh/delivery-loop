  - id: E2j
    criterion: AC-2
    executor: script
    cmd: config:executors.script.product_map
    expected: "Exit 0 — PRODUCT-MAP.md và LO-TRINH.html khớp hồ sơ (vẽ lại sau khi hồ sơ mốc đổi trạng thái)"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/release-3-1-0/chay.sh cua-so
    expected: >
      Exit 0 và dòng «XANH: hai tập bằng nhau» — tập hồ sơ ĐƯỢC KÝ trong cửa sổ `c16d25db..HEAD`, suy từ kho bằng QUAN HỆ
      (bỏ hồ sơ mốc `release-*`), BẰNG bốn hồ sơ kể trong Context.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/release-3-1-0/chay.sh dd-giu
    expected: >
      Exit 0 và dòng «XANH: diagram-design không đổi, giữ số» kèm «moc:   "version": "3.0.0", | HEAD:   "version": "3.0.0",».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/release-3-1-0/chay.sh goi-doi
    expected: >
      Exit 0 và dòng «XANH: hai gói chỉ đổi dòng version» — tập tệp đổi dưới `plugins/roadmap/` và `plugins/knowledge/` từ
      `c16d25db` tới HEAD bằng đúng hai tệp khai, mọi dòng đổi là dòng "version".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/release-3-1-0/chay.sh lop-chep
    expected: >
      Exit 0 và dòng «XANH: đúng 5 tệp đổi như ghi chú 3.1.0 kể» — 39 tệp trong khối INIT-CI-COPY-LIST; tệp đổi từ
      `c16d25db`: lib/workspace-record.cjs, scripts/can-cu-s1.cjs, scripts/hop-thu/hinh-dang.mjs, scripts/product-map.mjs,
      scripts/tro-ly-quyet-dinh.cjs.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-3-1-0/contract.md, _acceptance/loi-gop-trong-cau-ky/contract.md, _acceptance/loi-gop-trong-cau-ky/opportunity.md, _acceptance/loi-gop-trong-cau-ky/decisions.jsonl, _acceptance/loi-gop-trong-cau-ky/run-log.jsonl, _acceptance/loi-gop-trong-cau-ky/usage-report.md, docs/superpowers/specs/2026-11-21-loi-gop-trong-cau-ky-design.md, _acceptance/tep-chung-khong-chan-gop/contract.md, _acceptance/tep-chung-khong-chan-gop/decisions.jsonl, _acceptance/tep-chung-khong-chan-gop/run-log.jsonl, _acceptance/tep-chung-khong-chan-gop/usage-report.md, docs/superpowers/specs/2026-11-21-tep-chung-khong-chan-gop-design.md, _acceptance/mac-ky-co-phu-quyet/contract.md, _acceptance/mac-ky-co-phu-quyet/decisions.jsonl, _acceptance/mac-ky-co-phu-quyet/run-log.jsonl, _acceptance/mac-ky-co-phu-quyet/usage-report.md, docs/superpowers/specs/2026-11-22-mac-ky-co-phu-quyet-design.md, _acceptance/chuyen-gop/contract.md, _acceptance/chuyen-gop/decisions.jsonl, _acceptance/chuyen-gop/run-log.jsonl, _acceptance/chuyen-gop/usage-report.md, docs/superpowers/specs/2026-11-22-chuyen-gop-design.md, plugins/acceptance-gate/commands/acceptance-init.md]
    question: >
      Đọc AC-7 của contract release-3-1-0 và mục «## 3.1.0» của CHANGELOG.md (chỉ mục đó), cạnh đúng nguồn nó chép. (0) Ở bốn
      mục con của bốn hồ sơ: mỗi câu mô tả vòng (dòng «Gốc:» đọc ở opportunity.md nếu có, không thì Context của hợp đồng hay
      design doc; gạch «Vật:» chép dòng feature của hợp đồng; giới hạn trích trong ngoặc «»; cảnh báo chép nguyên ý từ Notes)
      có phải chữ của hồ sơ ấy — không tóm tắt sáng tạo, không nói rộng hơn — và số giới hạn (khai trước, chọn ở Cổng Bằng
      chứng, ghi ở Notes) có khớp Notes hợp đồng và các dòng `gate2` của sổ quyết định không? (1) Bảng năm dòng số: mỗi ô có
      khớp nguồn đếm — lượt chấm và phán quyết (dòng `round-tally`, `cay-doi` của run-log), out-token và tỉ lệ vai trò (bảng
      «vai tro» của usage-report.md), phút máy mỗi lượt (giờ bắt đầu/kết thúc ở cùng bảng), gọi người (dòng cổng của sổ quyết
      định, opportunity.md)? Thời gian làm-xong/ký/gộp không tra được từ các tệp này thì chỉ kiểm tính nhất quán nội bộ (trung
      vị khớp bốn ô). (2) Lời về lớp chép CI có đúng với khối INIT-CI-COPY-LIST của acceptance-init.md không — tệp kể có thuộc
      khối và tổng 39 đúng? (3) Đoạn «Vì sao 3.1.0» và «Ai bị ảnh hưởng» có nói thẳng các đổi hành vi chạm kho đang dùng mà
      bốn mục con kể — mọi hành vi mới sau khoá tự bật, cảnh báo mới của lượt chấm chạm mọi kho, lớp chép CI — và căn cứ chọn
      số có đúng với Context của hợp đồng release-3-1-0 không? Trả PASS khi cả bốn vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.kiem_ban_cai_moc
    long_running: 30
    expected: >
      Exit 0 — cổng số phiên bản của kiem-ban-cai-sau-phat-hanh: số trong tệp khai acceptance-gate ở HEAD khác gốc vòng nên
      lệnh chạy TRỌN kiểm bản cài trên HEAD (cài cách ly từ `git archive HEAD`), in dòng «TỔNG KẾT: ĐẠT … — HEAD (<sha>) cài
      đúng tag». Chiều đỏ sống trong ca của KC1. Đỏ → KHÔNG cắt mốc.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
