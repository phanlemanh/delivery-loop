# evals — release-3-1-0
# Không có bộ răng riêng (nếp từ 2.2.0 → 3.0.0, luật «mốc phát hành KHÔNG dựng răng»): thứ cần canh ở mọi lần cắt số là ca
# vĩnh viễn P200 (vùng 3 của suite plugins), các bộ kiểm chung, cửa sổ hồ sơ, cổng kiểm bản cài và hội đồng đọc mục
# CHANGELOG cạnh nguồn nó chép. Bốn lệnh riêng của hồ sơ đi qua `_acceptance/release-3-1-0/chay.sh` (luật lệnh hồ sơ,
# tep-chung-khong-chan-gop) — không thêm khoá vào `_acceptance/config.yaml`. Chiều đỏ của bốn lệnh ghi ở Notes hợp đồng.
# E1/E2h chấm MÃ THOÁT của vùng 3 — không hứa dòng P200 trong bằng chứng.
# long_running khai từ đầu cho hai lệnh dài: vùng 2 của suite plugins, kiểm bản cài trọn.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vùng 3 của suite plugins xanh, nên ca P200 (cùng vùng) xanh: năm gói lõi mang số 3.1.0, diagram-design 3.0.0
      hợp semver, mô tả acceptance-gate có mục v3.1.0, mục v3.1.0 của feature-loop khai cặp acceptance-gate >= 3.1.0, câu
      «Khớp phiên bản» của GUIDE dựng từ số trong tệp khai. Chiều đỏ sống trong chính P200 (các đột biến lệch số, GUIDE giữ
      số cũ, mô tả thiếu mục, câu khai cặp dời ra mục lịch sử, + đối chứng dương trên bản sao nguyên vẹn).
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2a
    criterion: AC-2
    executor: test
    cmd: config:executors.test.scripts_bash
    expected: "mảnh bash của suite scripts XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
