<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hai view từ ký tới gộp</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · tep-chung-khong-chan-gop</p>
    <h1>Một PR đổi một hồ sơ — từ lúc ký tới lúc gộp được</h1>

    <svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane dividers -->
      <line x1="40" y1="64" x2="1240" y2="64" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="312" x2="1240" y2="312" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="512" x2="1240" y2="512" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="200" y1="64" x2="200" y2="512" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- Lane labels -->
      <text x="48" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">HÔM NAY</text>
      <text x="48" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">KHO KHÔNG BẬT</text>
      <text x="48" y="352" fill="#2e5aa8" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.16em">KHO BẬT</text>
      <text x="48" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ban_do.ngoai_git</text>

      <!-- ===== Arrows (drawn before boxes) ===== -->
      <!-- Upper lane -->
      <line x1="400" y1="140" x2="436" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="140" x2="636" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="140" x2="836" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- KHÔNG → Gộp được -->
      <line x1="1032" y1="140" x2="1084" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1036" y="116" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1060" y="125" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
      <!-- CÓ → warn box -->
      <line x1="936" y1="184" x2="936" y2="228" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="944" y="200" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="956" y="209" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>
      <!-- Loop back to Nhánh chính dời -->
      <line x1="720" y1="232" x2="720" y2="172" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="652" y="196" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="205" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LẶP LẠI</text>

      <!-- Lower lane -->
      <line x1="400" y1="372" x2="436" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="372" x2="636" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="372" x2="836" y2="372" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <!-- Side branch -->
      <line x1="520" y1="400" x2="520" y2="440" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ===== Upper lane boxes ===== -->
      <rect x="224" y="112" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="224" y="112" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lệnh cổng vẽ lại bản đồ</text>
      <text x="312" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">và trang lộ trình</text>

      <rect x="440" y="112" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commit đưa</text>
      <text x="520" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hai view vào PR</text>

      <rect x="640" y="112" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="112" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhánh chính dời</text>
      <text x="720" y="154" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(PR khác gộp trước)</text>

      <!-- Decision -->
      <polygon points="936,96 1032,140 936,184 840,140" fill="#f5f5f5"/>
      <polygon points="936,96 1032,140 936,184 840,140" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="936" y="137" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Forge thấy xung đột</text>
      <text x="936" y="153" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ở hai view?</text>

      <rect x="1088" y="112" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="1088" y="112" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1160" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gộp được</text>

      <!-- Warn box (coral focal 1) -->
      <rect x="640" y="232" width="400" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="232" width="400" height="56" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="840" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gộp nhánh chính vào nhánh, vẽ lại, đẩy,</text>
      <text x="840" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chạy lại CI, có khi ghim lại</text>

      <!-- ===== Lower lane boxes ===== -->
      <rect x="224" y="344" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="224" y="344" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lệnh cổng vẽ lại tại chỗ</text>
      <text x="312" y="386" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(tệp bị .gitignore bỏ qua)</text>

      <rect x="440" y="344" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="344" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commit KHÔNG mang</text>
      <text x="520" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hai view</text>

      <rect x="640" y="344" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="344" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhánh chính dời</text>

      <!-- Good outcome -->
      <rect x="840" y="344" width="392" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="344" width="392" height="56" rx="6" fill="rgba(46,90,168,0.10)" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="1036" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không tệp nào trùng → gộp được,</text>
      <text x="1036" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không chạy lại CI</text>

      <!-- Side branch box -->
      <rect x="400" y="444" width="240" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="444" width="240" height="40" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="520" y="468" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">Ai cần xem → vẽ tại chỗ từ nguồn</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="536" x2="1240" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="132" y="548" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="156" y="556" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <rect x="220" y="548" width="16" height="10" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
      <text x="244" y="556" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chi phí sau chữ ký</text>

      <rect x="372" y="548" width="16" height="10" rx="2" fill="rgba(46,90,168,0.10)" stroke="#2e5aa8" stroke-width="1"/>
      <text x="396" y="556" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Gộp không vướng</text>

      <line x1="516" y1="553" x2="544" y2="553" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="552" y="556" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Vòng lặp khi nhánh chính dời tiếp</text>

      <rect x="732" y="548" width="16" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="756" y="556" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh phụ</text>

      <!-- Footnote -->
      <text x="40" y="600" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Số đo Inventory 10–21/11: 126 trên 134 lần gộp ngược xung đột dính LO-TRINH.html</text>
      <text x="1240" y="600" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">AC-2 · AC-4 · AC-6</text>
    </svg>
  </div>
</body>
</html>
