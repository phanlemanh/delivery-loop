schema_version: 1
feature_slug: tcg1-ghim-moc-truoc-vong
# Năm eval, một tệp răng. Theo luật lệnh hồ sơ: lệnh chấm là TỆP trong thư mục hồ sơ (`rang/do.sh <nhóm>`), không khoá
# nào trong _acceptance/config.yaml. Hai cây thử (cây PR · cây gộp thử --no-ff vào origin/main) và ba kho hỏi lịch sử
# (đủ · nông · mồ côi) do răng dựng trong lượt, dưới thư mục tạm; phán quyết đọc từ dòng TAP «ok/not ok» theo TÊN ca,
# số ca qua ghim theo ma trận viết trước và thông điệp ghim — không lấy từ mã thoát. Đối chứng chiều đỏ dùng bản tệp ca ở
# commit cố định 678572f0, không dùng origin/main (để răng không mắc chính lớp nó sửa).
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: bash _acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh ghim
    expected: >
      Hai cây thử là hai clone tạm có refs/remotes/origin/main đặt tường minh; răng in «cay <tên>: HEAD=<sha>
      origin/main=<sha>» và ghim: cây gộp thử origin/main == HEAD; cây PR origin/main là tổ tiên của HEAD và khác HEAD
      (sai → «quan he ref sai»). Trên cả hai cây: TCG-1 và TCG-1-bat của tcg-ban-do.test.mjs mỗi ca một dòng «ok»,
      «# fail 0», và tệp ca của cây khai MOC_TRUOC_VONG = 50840764d39b317d02eb4d881917bd128d67c86f. Chiều đỏ trên cùng hai cây:
      bản ca trước sửa (678572f0) cho «not ok» TCG-1 kèm «khong co ban truoc vong» ở cây gộp thử và «not ok» TCG-1-bat
      kèm «phep so khong thay thay doi cua vong» ở cây PR — thiếu một vế chiều đỏ thì răng ĐỎ «doi chung do mat».
      Kèm: mọi bước actions/checkout trong job manh và job tests của .github/workflows/gate.yml có fetch-depth: 0
      (thiếu → «checkout nong: <job>»).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["tests/scripts/tcg-ban-do.test.mjs", "_acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh", ".github/workflows/gate.yml"]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: bash _acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh dot
    expected: >
      Trên mỗi cây trong hai cây thử: `node --test tests/scripts/tcg-mutants.test.mjs` thoát 0, «# pass 18», «# fail 0»;
      có dòng «ok» cho đúng 18 tên viết trước: TCG-10-M0 · TCG-10-bo-kiem-chi-muc · TCG-10-bo-kiem-ignore ·
      TCG-10-tat-di-nhanh-moi · TCG-10-khoa-sai-la-tat · TCG-10-them-vo-dieu-kien · TCG-10-quet-tra-da-xoa ·
      TCG-10-quet-doc-khoa-rieng · TCG-10-bo-so-goc · TCG-10-ghi-de-hang-cu · TCG-10-them-khi-du · TCG-10-dem-nham-slug ·
      TCG-10-moc-moi-tep · TCG-10-day-khi-khong-doi · TCG-10-day-nhanh-mac-dinh · TCG-10-im-chu-thich ·
      TCG-10-im-tai-lieu · TCG-10-im-ho-so-rong. Thiếu tên nào → răng đỏ «thieu ca <tên>»; số ca khác 18 → «so ca lech».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["tests/scripts/tcg-mutants.test.mjs", "tests/scripts/tcg-ban-do.test.mjs", "_acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh"]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh vang
    expected: >
      Vật = cây đang kiểm (TCG_GOC), lịch sử hỏi ở ba kho dựng trong lượt (TCG_GIT_GOC): (a) clone đủ lịch sử tại HEAD →
      TCG-1 và TCG-1-bat «ok» (đối chứng dương); (b) clone nông --depth 1 → cả hai «not ok», thông điệp chứa
      «khong co commit moc» và «50840764»; (c) clone đủ lịch sử, HEAD là commit mồ côi → cả hai «not ok», thông điệp chứa
      «khong phai to tien cua HEAD» và «50840764». Không ca nào «# skip»/«# todo».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["tests/scripts/tcg-ban-do.test.mjs", "_acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh"]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh thong-diep
    expected: >
      Ca TCG-10-tat-di-nhanh-moi của tcg-mutants.test.mjs «ok», và ghim thông điệp của nhát ấy trong tệp chứa cả
      «lech byte», «tinh huong khop», «50840764» và «doi MOC_TRUOC_VONG ve goc cua vong do» (răng đọc phần tử của mảng
      NHAT mang tên tat-di-nhanh-moi, không đọc chú thích). Vì ca «ok» nghĩa là thông điệp đỏ THẬT chứa chuỗi ghim, hai
      vế cùng nhau chứng thông điệp in ra đủ bốn mẩu.
      Đối chứng: ca TCG-10-M0 «ok» trong cùng lượt.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["tests/scripts/tcg-mutants.test.mjs", "tests/scripts/tcg-ban-do.test.mjs", "_acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh"]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh hat-giong
    expected: >
      Hạt giống docs/plans/2026-11-22-hat-giong-moc-so-sanh-theo-trang-thai-nhanh.md có một dòng khớp
      `^Gốc:\s*\S+/_acceptance/tcg1-ghim-moc-truoc-vong`, kê ≥ 14 tham chiếu `tests/…:<số>` khác nhau, và mỗi tham chiếu
      trỏ tệp có thật mà cửa sổ ±3 dòng chứa `merge-base`, `origin/main`, `origin/HEAD`, `HEAD~1` hoặc `HEAD^`; hợp đồng của hồ sơ trích tên
      tệp hạt giống. Chiều đỏ trong cùng lượt: bản sao hạt giống dời số dòng của tham chiếu đầu sang dòng 1 của tệp ấy →
      răng phải báo «tham chieu khong tro moc» kèm tên tham chiếu; không báo thì răng ĐỎ «doi chung do mat».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
    paths: ["docs/plans/2026-11-22-hat-giong-moc-so-sanh-theo-trang-thai-nhanh.md", "_acceptance/tcg1-ghim-moc-truoc-vong/contract.md", "_acceptance/tcg1-ghim-moc-truoc-vong/rang/do.sh"]
