# evals — release-3-1-1 (khuôn release-3-1-0; mốc v3.1.0 = 0a93a5b9)
# Không có bộ răng riêng (nếp từ 2.2.0 → 3.0.0, luật «mốc phát hành KHÔNG dựng răng»): thứ cần canh ở mọi lần cắt số là ca
# vĩnh viễn P200 (vùng 3 của suite plugins), các bộ kiểm chung, cửa sổ hồ sơ, cổng kiểm bản cài và hội đồng đọc mục
# CHANGELOG cạnh nguồn nó chép; thêm E7 «thẻ mang đúng bản vá» của mốc vá. Năm lệnh riêng của hồ sơ đi qua `_acceptance/release-3-1-1/chay.sh` (luật lệnh hồ sơ,
# tep-chung-khong-chan-gop) — không thêm khoá vào `_acceptance/config.yaml`. Chiều đỏ của bốn lệnh ghi ở Notes hợp đồng.
# E1/E2h chấm MÃ THOÁT của vùng 3 — không hứa dòng P200 trong bằng chứng.
# long_running khai từ đầu cho hai lệnh dài: vùng 2 của suite plugins, kiểm bản cài trọn.
# Lối B (chủ kho 23/11): E3–E7 đo ở COMMIT MỐC (commit gắn thẻ v3.1.1 = commit cuối của nhánh mốc trước khi nhánh chính
# gộp vào) qua cờ `--dinh-moc` của chay.sh — sha ở dinh-moc.txt, vắng tệp thì là HEAD. E1, E2*, E9 vẫn đo HEAD.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: >
      Exit 0 — vùng 3 của suite plugins xanh, nên ca P200 (cùng vùng) xanh: năm gói lõi mang số 3.1.1, diagram-design 3.0.0
      hợp semver, mô tả acceptance-gate có mục v3.1.1, mục v3.1.1 của feature-loop khai cặp acceptance-gate >= 3.1.1, câu
      «Khớp phiên bản» của GUIDE dựng từ số trong tệp khai. Chiều đỏ sống trong chính P200 (các đột biến lệch số, GUIDE giữ
      số cũ, mô tả thiếu mục, câu khai cặp dời ra mục lịch sử, + đối chứng dương trên bản sao nguyên vẹn).
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2a
    criterion: AC-2
    executor: test
    cmd: config:executors.test.scripts_bash
    expected: "mảnh bash của suite scripts XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2b
    criterion: AC-2
    executor: test
    cmd: config:executors.test.scripts_mjs_1
    expected: "mảnh mjs:1/3 XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2c
    criterion: AC-2
    executor: test
    cmd: config:executors.test.scripts_mjs_2
    expected: "mảnh mjs:2/3 XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2d
    criterion: AC-2
    executor: test
    cmd: config:executors.test.scripts_mjs_3
    expected: "mảnh mjs:3/3 XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2e
    criterion: AC-2
    executor: test
    cmd: config:executors.test.hooks
    expected: "suite hooks XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2f
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins_vung_1
    expected: "vùng 1 của suite plugins XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2g
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins_vung_2
    long_running: 60
    expected: "vùng 2 của suite plugins XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2h
    criterion: AC-2
    executor: test
    cmd: config:executors.test.plugins_vung_3
    expected: "vùng 3 của suite plugins XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2i
    criterion: AC-2
    executor: test
    cmd: config:executors.test.workflows
    expected: "suite workflows XANH"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2j
    criterion: AC-2
    executor: script
    cmd: config:executors.script.product_map
    expected: "Exit 0 — PRODUCT-MAP.md và LO-TRINH.html khớp hồ sơ (vẽ lại sau khi hồ sơ mốc đổi trạng thái)"
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E3
    criterion: AC-3
    executor: script
    cmd: bash _acceptance/release-3-1-1/chay.sh cua-so --dinh-moc
    expected: >
      Exit 0 và dòng «XANH: hai tập bằng nhau» — tập hồ sơ ĐƯỢC KÝ trong cửa sổ `0a93a5b9..HEAD`, suy từ kho bằng QUAN HỆ
      (bỏ hồ sơ mốc `release-*`), đo ở commit mốc, BẰNG đúng một hồ sơ kể trong Context: va-chu-ky-giu-cho-lenh-gop.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-4
    executor: script
    cmd: bash _acceptance/release-3-1-1/chay.sh dd-giu --dinh-moc
    expected: >
      Exit 0 và dòng «XANH: diagram-design không đổi, giữ số» kèm «moc:   "version": "3.0.0", | HEAD:   "version": "3.0.0",».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5
    criterion: AC-5
    executor: script
    cmd: bash _acceptance/release-3-1-1/chay.sh goi-doi --dinh-moc
    expected: >
      Exit 0 và dòng «XANH: hai gói chỉ đổi dòng version» — tập tệp đổi dưới `plugins/roadmap/` và `plugins/knowledge/` từ
      `0a93a5b9` tới commit mốc bằng đúng hai tệp khai, mọi dòng đổi là dòng "version".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-6
    executor: script
    cmd: bash _acceptance/release-3-1-1/chay.sh lop-chep --dinh-moc
    expected: >
      Exit 0 và dòng «XANH: đúng 0 tệp đổi như ghi chú 3.1.1 kể» kèm «ghi chú 3.1.1 kể: (không chép gì)» — 39 tệp trong
      khối INIT-CI-COPY-LIST, không tệp nào đổi byte từ `0a93a5b9`; gạch «Lớp chép CI» của mục 3.1.1 nói đúng chữ «không
      chép gì».
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-7
    executor: script
    cmd: bash _acceptance/release-3-1-1/chay.sh vat-va --dinh-moc
    expected: >
      Exit 0 và dòng «XANH: thẻ mang đúng bản vá #26 — 4 tệp vật + 5 tệp khai, phần còn lại trùng byte 1a887948…» — tập
      tệp đổi dưới `plugins/` từ `0a93a5b9` tới commit mốc bằng bốn tệp của #26 (signoff.md, dieu-phoi.mjs, gop.mjs, SKILL.md của
      feature-loop) cộng năm tệp khai; ngoài năm tệp khai, `plugins/` ở commit mốc trùng byte `1a887948`. Chiều đỏ ở Notes.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-8
    executor: judgment
    inputs: [CHANGELOG.md, _acceptance/release-3-1-1/contract.md, _acceptance/va-chu-ky-giu-cho-lenh-gop/contract.md, _acceptance/va-chu-ky-giu-cho-lenh-gop/decisions.jsonl, _acceptance/va-chu-ky-giu-cho-lenh-gop/run-log.jsonl, _acceptance/va-chu-ky-giu-cho-lenh-gop/usage-report.md, _acceptance/release-3-1-1/do-dong-1.md, plugins/acceptance-gate/commands/acceptance-init.md]
    question: >
      Đọc AC-8 của contract release-3-1-1 và mục «## 3.1.1» của CHANGELOG.md (chỉ mục đó), cạnh đúng nguồn nó chép. (0) Ở mục
      con của hồ sơ va-chu-ky-giu-cho-lenh-gop: dòng «Gốc:» (Context của hợp đồng ấy), gạch «Vật:» (dòng feature của hợp
      đồng ấy), giới hạn trích trong ngoặc «», giới hạn khai trước (Notes) — có phải chữ của hồ sơ ấy, không tóm tắt sáng tạo,
      không nói rộng hơn — và số giới hạn chọn ở Cổng Bằng chứng có khớp Notes hợp đồng và các dòng `gate2` của sổ quyết định
      không? (1) Bảng năm dòng số: mỗi ô có khớp nguồn đếm — lượt chấm và phán quyết (dòng `round-tally` của run-log), làn ghim
      lại và phút của chúng (dòng `repin`/`repin-do`, khoá `tong_ket.phut`), out-token và tỉ lệ vai trò (bảng «vai tro» của
      usage-report.md), phút máy của lượt chấm (dòng `wall:` cùng tệp), gọi người (dòng `gate1`/`gate2`/`seal` của sổ quyết
      định), giờ làm-xong/ký/gộp và số lần gộp nhánh chính vào nhánh (bảng commit của do-dong-1.md)? (2) Lời về lớp chép CI
      có đúng với khối INIT-CI-COPY-LIST của acceptance-init.md không — mục nói «không chép gì» và không kể tệp nào của khối?
      (3) Đoạn «Vì sao 3.1.1» và «Ai bị ảnh hưởng» có nói thẳng đổi hành vi chạm kho đang dùng mà mục con kể (lệnh gộp theo
      lời chặn chữ ký giữ chỗ; gọi tay ở bố cục cài mà thiếu `--loi` thì bị chặn kèm lệnh giải), có nêu kho không cài gói điều
      phối hay không bật `feature_loop.gop_theo_loi_ky` thì không đổi hành vi, và căn cứ chọn số patch có đúng với Context của
      hợp đồng release-3-1-1 không? Trả PASS khi cả bốn vế đúng; FAIL nêu đúng vế và câu sai.
    evidence_required: [run_id, verdict, rationale]
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.kiem_ban_cai_moc
    long_running: 30
    expected: >
      Exit 0 — cổng số phiên bản của kiem-ban-cai-sau-phat-hanh: số trong tệp khai acceptance-gate ở HEAD khác gốc vòng nên
      lệnh chạy TRỌN kiểm bản cài trên HEAD (cài cách ly từ `git archive HEAD`), in dòng «TỔNG KẾT: ĐẠT … — HEAD (<sha>) cài
      đúng tag». Chiều đỏ sống trong ca của KC1. Đỏ → KHÔNG cắt mốc.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
