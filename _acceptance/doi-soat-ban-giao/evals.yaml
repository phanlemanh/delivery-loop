    expected: >
      exit 0; TAP có dòng «ok» cho "DS-08 thieu-truong" (năm hàng gỡ sha_nhanh_chinh · khoa · don · cay_ban · nhanh trên
      tệp bên viết thật sinh: thoát 0, co_vang nêu đúng trường, chiều của trường ấy không có trong lech dù giá trị hiện tại
